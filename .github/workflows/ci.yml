name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y verilator yosys build-essential
      - name: Fetch third-party AXI pieces
        run: make deps
      - name: Lint, simulate, synthesize, prove
        run: make all
